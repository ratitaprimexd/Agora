<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ágora · Niki</title>
  <meta name="description" content="Ágora: demo educativa de participación ciudadana de la República de Niki, en la Lumencracia.">
  <meta name="theme-color" content="#14b8c4">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ágora">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bubbles" aria-hidden="true"></div>
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-label="Menú"></aside>
  <div id="app">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Abrir menú">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="brand" href="#/"><img src="logo.webp" width="34" height="34" alt=""><b>Ágora</b></a>
      <button class="user-chip" id="userChip"></button>
    </header>
    <main id="view"></main>
  </div>
  <div class="modal-wrap" id="modal"><div class="modal" id="modalBody"></div></div>
  <div class="toast" id="toast" role="status"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
